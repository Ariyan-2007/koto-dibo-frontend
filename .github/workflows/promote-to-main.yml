name: Promote staging to main

on:
  push:
    branches: [staging]

permissions:
  contents: read
  pull-requests: write

jobs:
  open-pr:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Open or update promotion PR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          existing=$(gh pr list --base main --head staging --state open --json number --jq '.[0].number')
          if [ -n "$existing" ]; then
            echo "PR #$existing already open, nothing to do."
          else
            gh pr create \
              --base main \
              --head staging \
              --title "Promote staging to main" \
              --body "Automated PR to promote the latest \`staging\` changes into \`main\`. Merge once CI is green and the changes are verified."
          fi
